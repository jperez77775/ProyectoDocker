
services:
  # Servicio de Base de Datos
  database:
    image: mysql:8.0
    container_name: cv_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cv_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cv_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio Backend
  backend:
    image: docker.io/fullstack2026/perez-backend:v1
    container_name: cv_backend
    restart: always
    depends_on:
      database:
        condition: service_healthy # 👈 Espera a que el healthcheck de arriba dé luz verde
    ports:
      - "4000:4000"
    networks:
      - cv_network

  # Servicio Frontend
  frontend:
    image: docker.io/fullstack2026/perez-frontend:v1
    container_name: cv_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - cv_network

# Definición única de Red y Volumen para Persistencia
networks:
  cv_network:
    driver: bridge

volumes:
  mysql_data: